name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Sintassi + brace balance + invarianti build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verifica sintassi e bilanciamento braces/parens
        run: node scripts/check-balance.js elevator.html

      - name: SHA256 parity dist/index.html === elevator.html (build copy non-drift)
        run: |
          # dist/index.html e' la copia deployabile di elevator.html (build copy).
          # Se divergono, qualcuno ha modificato solo uno dei due file: errore
          # di workflow. Fix: rigenera dist/index.html (copia esatta) e ri-commit.
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html mancante — copia elevator.html in dist/index.html"
            exit 1
          fi
          SHA_MAIN=$(sha256sum elevator.html | awk '{print $1}')
          SHA_DIST=$(sha256sum dist/index.html | awk '{print $1}')
          echo "  elevator.html : $SHA_MAIN"
          echo "  dist/index.html: $SHA_DIST"
          if [ "$SHA_MAIN" != "$SHA_DIST" ]; then
            echo "::error::SHA256 dist/index.html ($SHA_DIST) != elevator.html ($SHA_MAIN). dist deve essere copia identica."
            exit 1
          fi
          echo "OK: dist/index.html allineato a elevator.html"

      - name: Funzioni < 150 righe (invariante D24 Polish Pack V4)
        run: |
          # Contratto D24: tutte le funzioni top-level devono essere < 150 righe.
          # find-long-fns.js fa il conteggio rigoroso (brace-balance).
          # Cerchiamo "  NNN lines" con NNN >= 150 nell'output del tool.
          OUT=$(node scripts/find-long-fns.js 2>&1)
          echo "$OUT" | tail -40
          # Conta righe >= 150 guardando le intestazioni "  NNN lines" o "  NNN  L..."
          # Il formato di find-long-fns.js emette "  NNN lines" (>= 2 spazi) o "  NNN  L".
          LONG_FNS=$(echo "$OUT" | grep -E '^\s+([0-9]{3,})\s+(lines|L)' | awk '{print $1}' | awk -v t=150 '$1 >= t' | wc -l)
          if [ "$LONG_FNS" != "0" ]; then
            echo "::error::$LONG_FNS funzioni >= 150 righe (D24 violato):"
            echo "$OUT" | grep -E '^\s+([0-9]{3,})\s+(lines|L)' | awk -v t=150 '$1 >= t'
            exit 1
          fi
          echo "OK: 0 funzioni >= 150 righe (D24 invariante rispettato)"

  tests:
    name: Test framework (Polish Pack V2 Step 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verifica export BossHotelPure in elevator.html
        run: |
          if ! grep -q 'window.BossHotelPure' elevator.html; then
            echo "::error::window.BossHotelPure non trovato in elevator.html"
            exit 1
          fi
          echo "OK: window.BossHotelPure trovato"

      - name: Verifica tests.html presente e con almeno 30 test
        run: |
          if [ ! -f tests.html ]; then
            echo "::error::tests.html mancante"
            exit 1
          fi
          # Conta le chiamate test('...', ...) nel file (escludendo stringhe/commenti)
          COUNT=$(grep -cE "^\s+test\('" tests.html || true)
          echo "Test trovati in tests.html: $COUNT"
          if [ "$COUNT" -lt 30 ]; then
            echo "::error::Servono almeno 30 test, trovati $COUNT"
            exit 1
          fi
          echo "OK: $COUNT test (>= 30)"

      - name: Smoke test iframe loading via node (no browser)
        run: |
          # Verifica statica: elevator.html referenziato in tests.html
          if ! grep -q 'elevator.html' tests.html; then
            echo "::error::tests.html non referenzia elevator.html"
            exit 1
          fi
          echo "OK: tests.html referenzia elevator.html"

  # ===========================================================================
  # Esecuzione REALE dei test in browser headless.
  # ===========================================================================
  # La job `tests` qui sopra e' solo statica (grep): non esegue un solo test.
  # E' cosi' che 4 test sono rimasti rossi per mesi senza allarme, e che i bug
  # bloccanti "overlay portrait iPhone" e "startBtn irraggiungibile su desktop"
  # sono arrivati in main. Questa job chiude il gap: esegue tests.html in
  # Chromium headless e fallisce se un test non passa.
  # ===========================================================================
  tests-run:
    name: Esecuzione test in browser (Chromium headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Installa Playwright + Chromium
        run: |
          # Versione pinnata: i runner Ubuntu GitHub non hanno Playwright
          # preinstallato e la versione deve essere allineata al build del
          # browser che viene scaricato, altrimenti si ottiene
          # "Executable doesn't exist" (esperienza diretta).
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Esegui tests.html (server HTTP + Chromium headless)
        run: |
          node scripts/run-tests.js

      - name: Upload risultati test (artefatto in caso di fallimento)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output
          path: test-output.json
          if-no-files-found: ignore

  # ===========================================================================
  # Test COMPORTAMENTALI di layout e interazione.
  # ===========================================================================
  # `tests-run` esegue 285 test su funzioni pure dentro un iframe nascosto:
  # nessun layout, nessun rendering. Per questo NON avrebbe beccato i due
  # bug bloccanti chiusi il 2026-09-28, entrambi di CSS:
  #   - #startBtn sotto il bordo inferiore su 1366x768 / 1280x720 / ...
  #   - overlay "ruota il dispositivo" che intercettava i tap su iPhone
  # Una CI verde poteva quindi stare accanto a un'app inutilizzabile.
  # Questa job verifica il comportamento reale: l'utente puo' premere il
  # pulsante start? Il tap arriva al pulsante o a un overlay? La scena
  # renderizza qualcosa?
  # ===========================================================================
  ui-tests:
    name: Test UI layout e interazione (Chromium headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Cache browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.56.0

      - name: Installa Playwright + Chromium
        run: |
          # Stessa versione di tests-run: i due runner devono usare lo stesso
          # build del browser, altrimenti "Executable doesn't exist".
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Esegui test UI (server HTTP + Chromium headless)
        run: |
          node scripts/run-ui-tests.js

      - name: Upload risultati test UI (artefatto in caso di fallimento)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-test-output
          path: ui-test-output.json
          if-no-files-found: ignore
